[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-generation-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for Python repositories"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Documentation claim auditor contributors"}]
dependencies = []

[project.scripts]
text-generation-claim-audit = "text_generation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["text_generation_claim_audit*"]
